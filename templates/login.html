<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HireAI</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}?v=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    {% include "includes/navbar.html" %}
    <div class="glass-card p-8 md:p-10">
        {% include "includes/flash.html" %}
       

        <div class="text-center mb-8">
            <div class="icon-container">
                <i class="fas fa-fingerprint"></i>
            </div>
            <h2 class="text-2xl font-bold">Welcome Back</h2>
            <p class="text-gray-400 text-sm mt-1">Log in to your talent or recruiter account.</p>
        </div>
        
        <form class="space-y-5" action="/login" method="post">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-gray-400 ml-1">Email Address</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="input-glass pl-11" name="email" placeholder="name@company.com">
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between items-center px-1">
                    <label class="text-xs font-semibold text-gray-400">Password</label>
                    <a href="#" class="text-[10px] text-indigo-400 hover:underline">Forgot password?</a>
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"><i class="fas fa-lock"></i></span>
                    <input type="password" class="input-glass pl-11" name="password" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center gap-2 text-xs text-gray-400 px-1">
                <input type="checkbox" class="rounded bg-white/5 border-white/10 accent-indigo-500">
                <span>Keep me logged in</span>
            </div>

            <button class="w-full py-4 btn-primary rounded-xl font-bold mt-2">Sign In</button>
        </form>
<!-- 
        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/5"></div></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-[#121214] px-4 text-gray-500">Or continue with</span></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button class="social-btn">
                <i class="fab fa-google"></i> Google
            </button>
            <button class="social-btn">
                <i class="fab fa-linkedin-in"></i> LinkedIn
            </button>
        </div> -->

        <div class="mt-8 pt-6 border-t border-white/5 text-center">
            <p class="text-sm text-gray-500">
                New to HireAI? <a href="/register" class="text-indigo-400 font-semibold hover:underline">Create an account</a>
            </p>
        </div>
    </div>

    {% include "includes/footer.html" %}


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Job Post | HireAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="{{ url_for('static', path='css/company/create_job.css') }}?v=1">
</head>
<body class="flex">

    <div class="dashboard-glow"></div>

    {% include "includes/sidebar.html" %}
    
    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-8 lg:p-10">
        
        {% include "includes/company_navbar.html" %}

         {% include "includes/flash.html" %}

            <div class="max-w-4xl mx-auto">
                <!-- Header -->
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center gap-4">
                        <button onclick="window.location.href='company_dashboard.html'" class="w-10 h-10 rounded-full glass-card flex items-center justify-center hover:bg-white/10 transition">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <h1 class="text-3xl font-bold">Post a <span class="gradient-text">New Opportunity</span></h1>
                    </div>
                    <div class="hidden md:flex items-center gap-2 px-4 py-2 glass-card rounded-full text-xs font-medium text-gray-400">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        AI Matching Active
                    </div>
                </div>

                <form action="/company/create_job" method="POST">
                    <!-- Basic Details -->
                    <div class="glass-card p-8 mb-6">
                        <div class="section-label">
                            <i class="fas fa-info-circle"></i> Basic Information
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <input type="text"  name="company_id" value="{{ user.assosiated_with }}" style="display:none" required>
                            <div class="space-y-2">
                                <label class="text-sm text-gray-400">Job Title</label>
                                <input type="text" class="input-glass" name="title" placeholder="e.g. Senior Software Engineer" required>
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm text-gray-400">Department</label>
                                <select class="input-glass bg-[#121214]" name="department">
                                    <option>Engineering</option>
                                    <option>Design</option>
                                    <option>Marketing</option>
                                    <option>Sales</option>
                                    <option>Human Resources</option>
                                    <option>Technology</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm text-gray-400">Location</label>
                                <input type="text" class="input-glass" name="location" placeholder="e.g. Remote, New York, NY">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm text-gray-400">Employment Type</label>
                                <div class="flex gap-2">
                                    <label class="flex-1">
                                        <input type="radio" value="Full-time" name="type" class="hidden peer" checked>
                                        <div class="text-center p-3 rounded-xl border border-white/10 bg-white/5 peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 transition cursor-pointer text-sm">Full-time</div>
                                    </label>
                                    <label class="flex-1">
                                        <input type="radio" name="type" value="Part-time" class="hidden peer">
                                        <div class="text-center p-3 rounded-xl border border-white/10 bg-white/5 peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 transition cursor-pointer text-sm">Part-time</div>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="mt-6 space-y-2">
                            <label class="text-sm text-gray-400">Job Description</label>
                            <textarea class="input-glass min-h-[150px] resize-none" name="description" placeholder="Describe the role, responsibilities, and team..."></textarea>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="flex items-center justify-end gap-4 mb-20">
                        <button type="submit" class="px-12 py-4 btn-primary rounded-2xl font-bold shadow-xl">Publish Job Posting</button>
                    </div>
                </form>
            </div>

      </main>

</body>
</html>

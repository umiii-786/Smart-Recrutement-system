    <script>
        const jobsData = {{ jobs | tojson }};
    </script>
    <script>
        const jobsContainer = document.getElementById('jobs-container');
        const sentinel = document.getElementById('bottom-sentinel');
        const jobCountDisplay = document.getElementById('job-count');

        let currentIndex = 0;
        const jobsPerPage = 5; // how many to load each time

        const colors = ["bg-blue-500", "bg-purple-500", "bg-indigo-500", "bg-pink-500", "bg-orange-500"];

        // ✅ Create card from REAL job object
        function createJobCard(job) {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const card = document.createElement('div');
            card.className = 'glass-card p-6 flex flex-col h-full';

            card.innerHTML = `
        <div class="flex justify-between items-start mb-4">
            <div class="w-12 h-12 rounded-xl ${randomColor} flex items-center justify-center text-xl font-bold">
                ${job.title.charAt(0)}
            </div>
            <button class="text-gray-500 hover:text-pink-500 transition">
                <i class="far fa-bookmark"></i>
            </button>
        </div>

        <h4 class="font-bold text-lg mb-1">${job.title}</h4>
        <p class="text-indigo-400 text-sm font-medium mb-4">${job.department || "Company"}</p>

        <div class="flex flex-wrap gap-2 mb-6">
            <span class="tag">${job.location}</span>
            <span class="tag">${job.job_type}</span>
            <span class="tag">${job.submitted_applications} Applicants</span>
        </div>

        <div class="mt-auto pt-6 border-t border-white/5 flex items-center justify-between">
            <div class="text-[10px] text-gray-500">
                <i class="far fa-clock mr-1"></i> ${formatDate(job.created_at)}
            </div>
            <a href='/jobs/${job.id}' class="px-4 py-2 btn-apply rounded-lg text-xs font-bold shadow-lg">
                Apply Now
            </a>
        </div>
    `;

            return card;
        }



        function loadMoreJobs() {
    if (currentIndex >= jobsData.length) {
        sentinel.innerHTML = "<p class='text-gray-500 text-sm'>No more jobs available.</p>";
        return;
    }

    setTimeout(() => {
        let count = 0;

        while (count < jobsPerPage && currentIndex < jobsData.length) {
            jobsContainer.appendChild(createJobCard(jobsData[currentIndex]));
            currentIndex++;
            count++;
        }

        jobCountDisplay.innerText = `${currentIndex} Jobs`;
    }, 500);
}


function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toDateString(); // simple format
}

const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
        loadMoreJobs();
    }
}, { threshold: 1.0 });

observer.observe(sentinel);

// initial load
loadMoreJobs();
    </script>
